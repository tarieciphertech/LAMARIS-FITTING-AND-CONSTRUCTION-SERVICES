name: Repair property image migration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-property-image-migration.yml"
      - "backend/migrations/versions/20261002_0003_import_property_images.py"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace rate-limited importer
        shell: bash
        run: |
          set -euo pipefail
          target="backend/migrations/versions/20261002_0003_import_property_images.py"
          if grep -q 'GITHUB_API = ' "$target"; then
            git fetch origin fix/property-image-import-v2
            git show origin/fix/property-image-import-v2:"$target" > "$target"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$target"
            git commit -m "Fix property image importer"
            git push origin HEAD:main
          else
            echo "Property image importer is already repaired."
          fi
